  <h2 style="margin-top:0;">GHISA non si è caricata</h2>
  <p id="fallback-msg" style="color:#8B8B93; line-height:1.5;"></p>
  <p style="color:#8B8B93; font-size:13px;">Prova a ricaricare la pagina, oppure prova con un'altra connessione (WiFi/dati mobili) — a volte un firewall o un blocco annunci impedisce il caricamento di alcune risorse esterne.</p>
</div>

<script>
  // Fires on a fixed timer, independent of whether the library scripts below
  // ever finish loading (a silently-blocked network request never fires
  // window "load", so we do not wait for that event).
  setTimeout(function () {
    var root = document.getElementById("root");
    if (!root || root.children.length === 0) {
      document.getElementById("fallback").style.display = "block";
      var msg = [];
      if (typeof React === "undefined") msg.push("React non si è caricato da nessuno dei due CDN provati (probabile blocco di rete/firewall verso jsdelivr.net e unpkg.com).");
      if (typeof ReactDOM === "undefined") msg.push("ReactDOM non si è caricato.");
      if (typeof Babel === "undefined") msg.push("Babel non si è caricato.");
      if (msg.length === 0) msg.push("Le librerie si sono caricate correttamente, ma l'app non è riuscita ad avviarsi — probabile errore nel codice. Apri la Console del browser (F12 su desktop) per il dettaglio.");
      document.getElementById("fallback-msg").textContent = msg.join(" ");
    }
  }, 6000);
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback, useRef, forwardRef, useImperativeHandle } = React;

// ---------------------------------------------------------------------------
// Minimal local storage backend (mirrors the shape of the original storage API)
// ---------------------------------------------------------------------------
const storage = {
  get: async (key) => {
    const raw = window.localStorage.getItem(key);
    if (raw === null) throw new Error("not found");
    return { key, value: raw, shared: false };
  },
  set: async (key, value) => {
    try {
      window.localStorage.setItem(key, value);
      return { key, value, shared: false };
    } catch (e) {
      return null;
    }
  },
};

// ---------------------------------------------------------------------------
// Minimal icon set (stroke-based, mimics lucide style) — no external icon lib
// ---------------------------------------------------------------------------
function Icon({ name, size = 16, color = "currentColor", style }) {

  switch (name) {
    case "dumbbell": return <svg {...c}><line x1="4" y1="12" x2="20" y2="12" /><rect x="2" y="9" width="4" height="6" rx="1" /><rect x="18" y="9" width="4" height="6" rx="1" /></svg>;
    case "flame": return <svg {...c}><path d="M12 2c1.2 4-2.6 5.2-2.6 9.2A4.6 4.6 0 0014 15.8c1.7 0 3.2-.9 4-2.3.6 1 .6 2.3 0 3.3A6.6 6.6 0 0112 20a6.6 6.6 0 01-6-9.4C7 8 9 6.8 8.6 4.4 9.8 5 11 6.4 11 8c0-2.4-.4-4.4 1-6z" /></svg>;
    case "trophy": return <svg {...c}><path d="M6 4h12v3a6 6 0 01-12 0V4z" /><path d="M9 17h6" /><path d="M12 13v4" /><path d="M6 4H4a3 3 0 003 3" /><path d="M18 4h2a3 3 0 01-3 3" /></svg>;
    case "calendar": return <svg {...c}><rect x="3" y="5" width="18" height="16" rx="2" /><line x1="3" y1="10" x2="21" y2="10" /><line x1="8" y1="3" x2="8" y2="7" /><line x1="16" y1="3" x2="16" y2="7" /></svg>;
    case "plus": return <svg {...c}><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></svg>;
    case "trash2": return <svg {...c}><polyline points="3 6 5 6 21 6" /><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6" /><path d="M10 11v6" /><path d="M14 11v6" /><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2" /></svg>;
    case "chevronDown": return <svg {...c}><polyline points="6 9 12 15 18 9" /></svg>;
    case "chevronUp": return <svg {...c}><polyline points="18 15 12 9 6 15" /></svg>;
    case "trendingUp": return <svg {...c}><polyline points="3 17 9 11 13 15 21 6" /><polyline points="14 6 21 6 21 13" /></svg>;
    case "award": return <svg {...c}><circle cx="12" cy="8" r="6" /><path d="M9 14l-2 7 5-3 5 3-2-7" /></svg>;
    case "lock": return <svg {...c}><rect x="5" y="11" width="14" height="9" rx="2" /><path d="M8 11V7a4 4 0 018 0v4" /></svg>;
    case "check": return <svg {...c}><polyline points="20 6 9 17 4 12" /></svg>;
    case "x": return <svg {...c}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>;
    case "arrowUp": return <svg {...c}><line x1="12" y1="19" x2="12" y2="5" /><polyline points="5 12 12 5 19 12" /></svg>;
    case "arrowDown": return <svg {...c}><line x1="12" y1="5" x2="12" y2="19" /><polyline points="19 12 12 19 5 12" /></svg>;
    case "repeat": return <svg {...c}><polyline points="17 1 21 5 17 9" /><path d="M3 11V9a4 4 0 014-4h14" /><polyline points="7 23 3 19 7 15" /><path d="M21 13v2a4 4 0 01-4 4H3" /></svg>;
    case "timer": return <svg {...c}><circle cx="12" cy="13" r="8" /><line x1="12" y1="9" x2="12" y2="13" /><line x1="12" y1="13" x2="15" y2="15" /><line x1="9" y1="2" x2="15" y2="2" /></svg>;
    case "pause": return <svg {...c}><rect x="6" y="4" width="4" height="16" /><rect x="14" y="4" width="4" height="16" /></svg>;
    case "rotateCcw": return <svg {...c}><polyline points="1 4 1 10 7 10" /><path d="M3.51 15a9 9 0 102.13-9.36L1 10" /></svg>;
    case "play": return <svg {...c}><polygon points="5 3 19 12 5 21 5 3" /></svg>;
    case "checkCircle2": return <svg {...c}><path d="M22 11.08V12a10 10 0 11-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" /></svg>;
    default: return null;
  }
}

// ---------------------------------------------------------------------------
// Static program data (Diego's 4-day split)

const PROGRAM = {

  G2: { label: "Tirata", color: "#2E6E8E", exercises: ["Lat machine presa larga", "Straight-arm pulldown (single arm)", "Rematore machine", "Pulley basso presa neutra", "Rematore un braccio manubrio", "Curl bilanciere/manubri", "Curl a martello", "Face pull"] },
  G3: { label: "Gambe", color: "#3E7A4F", exercises: ["Leg press", "Leg extension", "Leg curl", "Calf raise"] },
  G4: { label: "Ibrido (Spinta + Tirata)", color: "#8A6A1F", exercises: ["Chest press machine", "Lat machine presa stretta", "Shoulder press machine", "Pulley basso", "Pec deck", "Rematore machine", "Curl bilanciere", "French press", "Curl a martello"] },
  LIBERO: { label: "Libera", color: "#5A5A62", exercises: [] },
};

const STORAGE_KEY = "ghisa-data-v1";
const DEFAULT_ORDER = ["G1", "G2", "G3", "G4"];

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
function estOneRM(weight, reps) { if (!weight || !reps) return 0; return weight * (1 + reps / 30); }
function isoDate(d) { const dt = d instanceof Date ? d : new Date(d); return dt.toISOString().slice(0, 10); }
function startOfWeek(d) { const dt = new Date(d); const day = (dt.getDay() + 6) % 7; dt.setDate(dt.getDate() - day); dt.setHours(0, 0, 0, 0); return dt; }
function computeNextSuggested(workouts, dayOrder) {
  if (workouts.length === 0) return dayOrder[0];
  const last = [...workouts].sort((a, b) => new Date(b.date) - new Date(a.date))[0];
  const idx = dayOrder.indexOf(last.day);
  if (idx === -1) return dayOrder[0];
  return dayOrder[(idx + 1) % dayOrder.length];
}

// ---------------------------------------------------------------------------
// Achievements engine
// ---------------------------------------------------------------------------
function computeStats(workouts) {
  const totalWorkouts = workouts.length;
  let totalVolume = 0;
  const prByExercise = {};
  const prBreaksCount = { count: 0 };
  const dayTypesUsed = new Set();
  let earlyBird = false;
  const sorted = [...workouts].sort((a, b) => new Date(a.date) - new Date(b.date));
  for (const w of sorted) {
    dayTypesUsed.add(w.day);
    if (w.loggedHour !== undefined && w.loggedHour < 8) earlyBird = true;
    for (const ex of w.exercises) {
      for (const s of ex.sets) {
        const vol = (Number(s.weight) || 0) * (Number(s.reps) || 0);
        totalVolume += vol;
        const e1 = estOneRM(Number(s.weight) || 0, Number(s.reps) || 0);
        const prev = prByExercise[ex.name];
        if (!prev || e1 > prev.est1rm) {
          if (prev) prBreaksCount.count += 1;
          prByExercise[ex.name] = { est1rm: e1, weight: Number(s.weight) || 0, reps: Number(s.reps) || 0, date: w.date };
        }
      }
    }
  }
  const weeksWithWorkout = new Set(sorted.map((w) => startOfWeek(w.date).getTime()));
  let streak = 0;
  let cursor = startOfWeek(new Date());
  while (weeksWithWorkout.has(cursor.getTime())) {
    streak += 1;
    cursor = new Date(cursor);
    cursor.setDate(cursor.getDate() - 7);
  }
  const perWeekCount = {};
  for (const w of sorted) {
    const key = startOfWeek(w.date).getTime();
    perWeekCount[key] = (perWeekCount[key] || 0) + 1;
  }
  const perfectWeeks = Object.values(perWeekCount).filter((c) => c >= 4).length;
  const weekKeys = Object.keys(perWeekCount).map(Number).sort((a, b) => a - b);
  let bestConsistencyStreak = 0, currentRun = 0, prevKey = null;
  for (const wk of weekKeys) {
    if (perWeekCount[wk] >= 4) {
      if (prevKey !== null && wk - prevKey === 7 * 24 * 3600 * 1000) currentRun += 1;
      else currentRun = 1;
      bestConsistencyStreak = Math.max(bestConsistencyStreak, currentRun);
    } else currentRun = 0;
    prevKey = wk;
  }
  return { totalWorkouts, totalVolume, prByExercise, prBreaks: prBreaksCount.count, dayTypesUsed, weeklyStreak: streak, perfectWeeks, bestConsistencyStreak, earlyBird };
}

function buildAchievements(stats) {
  return [
    { id: "first", name: "Primo Carico", desc: "Registra il tuo primo allenamento", unlocked: stats.totalWorkouts >= 1, progress: `${Math.min(stats.totalWorkouts, 1)}/1` },
    { id: "ten", name: "Decade di Ferro", desc: "10 allenamenti registrati", unlocked: stats.totalWorkouts >= 10, progress: `${Math.min(stats.totalWorkouts, 10)}/10` },
    { id: "twentyfive", name: "Mezzo Centinaio", desc: "25 allenamenti registrati", unlocked: stats.totalWorkouts >= 25, progress: `${Math.min(stats.totalWorkouts, 25)}/25` },
    { id: "fifty", name: "Centurione (metà)", desc: "50 allenamenti registrati", unlocked: stats.totalWorkouts >= 50, progress: `${Math.min(stats.totalWorkouts, 50)}/50` },
    { id: "vol10k", name: "10 Tonnellate", desc: "10.000kg di volume cumulativo sollevato", unlocked: stats.totalVolume >= 10000, progress: `${Math.min(Math.round(stats.totalVolume), 10000).toLocaleString("it-IT")}/10.000kg` },
    { id: "vol50k", name: "50 Tonnellate", desc: "50.000kg di volume cumulativo sollevato", unlocked: stats.totalVolume >= 50000, progress: `${Math.min(Math.round(stats.totalVolume), 50000).toLocaleString("it-IT")}/50.000kg` },
    { id: "vol100k", name: "100 Tonnellate", desc: "100.000kg di volume cumulativo sollevato", unlocked: stats.totalVolume >= 100000, progress: `${Math.min(Math.round(stats.totalVolume), 100000).toLocaleString("it-IT")}/100.000kg` },
    { id: "perfectweek", name: "Settimana Perfetta", desc: "4 allenamenti in una sola settimana", unlocked: stats.perfectWeeks >= 1, progress: stats.perfectWeeks >= 1 ? "Fatto" : "0/1" },
    { id: "consistency4", name: "Costanza di Ghisa", desc: "4 settimane consecutive con 4+ allenamenti", unlocked: stats.bestConsistencyStreak >= 4, progress: `${Math.min(stats.bestConsistencyStreak, 4)}/4 settimane` },
    { id: "prbreaker", name: "Cacciatore di Record", desc: "Migliora un record personale 5 volte", unlocked: stats.prBreaks >= 5, progress: `${Math.min(stats.prBreaks, 5)}/5` },
    { id: "fullcycle", name: "Ciclo Completo", desc: "Registra almeno un allenamento per ogni giorno del programma", unlocked: ["G1", "G2", "G3", "G4"].every((d) => stats.dayTypesUsed.has(d)), progress: `${["G1", "G2", "G3", "G4"].filter((d) => stats.dayTypesUsed.has(d)).length}/4 giorni` },
    { id: "earlybird", name: "Alba di Ferro", desc: "Registra un allenamento fatto prima delle 8:00", unlocked: stats.earlyBird, progress: stats.earlyBird ? "Fatto" : "0/1" },
  ];
}

const inputStyle = { background: "var(--bg)", border: "1px solid var(--line)", borderRadius: 6, padding: "7px 10px", color: "var(--text)", fontSize: 13, width: 70 };
const iconBtnStyle = { background: "none", border: "none", cursor: "pointer", padding: 4 };
const smallBtnStyle = { background: "none", border: "1px solid var(--line)", borderRadius: 6, color: "var(--muted)", fontSize: 12, padding: "6px 10px", cursor: "pointer", display: "flex", alignItems: "center", gap: 4 };

// ---------------------------------------------------------------------------
// Rest timer (imperative start via ref)
// ---------------------------------------------------------------------------
const RestTimer = forwardRef(function RestTimer({ accentColor, presets = [30, 45, 60, 75, 90, 120] }, ref) {
  const [running, setRunning] = useState(false);
  const [remaining, setRemaining] = useState(presets[2] || 60);
  const [duration, setDuration] = useState(presets[2] || 60);
  const intervalRef = useRef(null);

  useEffect(() => {
    if (running && remaining > 0) {
      intervalRef.current = setInterval(() => {
        setRemaining((r) => {
          if (r <= 1) { clearInterval(intervalRef.current); setRunning(false); return 0; }
          return r - 1;
        });
      }, 1000);
      return () => clearInterval(intervalRef.current);
    }
  }, [running]);

  function start(sec) { const d = sec ?? duration; setDuration(d); setRemaining(d); setRunning(true); }
  function reset() { setRunning(false); setRemaining(duration); }
  useImperativeHandle(ref, () => ({ start }));

  const mm = Math.floor(remaining / 60);
  const ss = String(remaining % 60).padStart(2, "0");

  return (
    <div style={{ background: "var(--bg)", border: "1px solid var(--line)", borderRadius: 8, padding: 10, marginTop: 6, marginBottom: 4 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <Icon name="timer" size={13} color={accentColor} />
          <span style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 22, letterSpacing: 0.5, color: remaining === 0 && !running ? "var(--muted)" : "var(--text)" }}>{mm}:{ss}</span>
        </div>
        <div style={{ display: "flex", gap: 5 }}>
          <button onClick={() => setRunning((r) => !r)} style={{ ...smallBtnStyle, borderColor: accentColor, color: accentColor, padding: "4px 8px" }}>
            <Icon name={running ? "pause" : "timer"} size={12} />
          </button>
          <button onClick={reset} style={{ ...smallBtnStyle, padding: "4px 8px" }}><Icon name="rotateCcw" size={12} /></button>
        </div>
      </div>
      <div style={{ display: "flex", gap: 4, marginTop: 6, flexWrap: "wrap" }}>
        {presets.map((s) => (
          <button key={s} onClick={() => start(s)} style={{ ...smallBtnStyle, flex: "1 1 40px", justifyContent: "center", padding: "4px 6px", fontSize: 11 }}>{s}s</button>
        ))}
      </div>
    </div>
  );
});

// ---------------------------------------------------------------------------
// Session (total workout) timer, with manual start
// ---------------------------------------------------------------------------
function SessionTimer({ accentColor, elapsed, running, onToggle, started, onStart }) {
  const mm = Math.floor(elapsed / 60);
  const ss = String(elapsed % 60).padStart(2, "0");
  if (!started) {
    return (
      <button onClick={onStart} style={{ width: "100%", padding: "16px", borderRadius: 10, border: "none", background: accentColor, color: "#fff", fontWeight: 700, fontSize: 15, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, marginBottom: 12 }}>
        <Icon name="play" size={18} /> Inizia allenamento
      </button>
    );
  }
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: "var(--surface)", border: "1px solid var(--line)", borderRadius: 10, padding: "10px 14px", marginBottom: 12 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <Icon name="timer" size={14} color={accentColor} />
        <span style={{ fontSize: 12, color: "var(--muted)" }}>Durata sessione</span>
        <span style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 22, color: "var(--text)", letterSpacing: 0.5 }}>{mm}:{ss}</span>
      </div>
      <button onClick={onToggle} style={{ ...smallBtnStyle, borderColor: accentColor, color: accentColor }}>
        <Icon name={running ? "pause" : "timer"} size={12} /> {running ? "Pausa" : "Riprendi"}
      </button>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Exercise card — draft set + one-tap "Serie fatta" that logs + starts rest
// ---------------------------------------------------------------------------
function ExerciseCard({ ex, idx, dayColor, onToggleOpen, onMoveUp, onMoveDown, canMoveUp, canMoveDown, confirmIdx, onRequestRemove, onCancelRemove, onConfirmRemove, onAddCompletedSet, onUpdateSet, onRemoveSet }) {
  const lastSet = ex.sets[ex.sets.length - 1];
  const [draftWeight, setDraftWeight] = useState(lastSet ? lastSet.weight : "");
  const [draftReps, setDraftReps] = useState(lastSet ? lastSet.reps : "");
  const restRef = useRef(null);

  function handleDone() {
    if (draftWeight === "" || draftReps === "") return;
    onAddCompletedSet(idx, draftWeight, draftReps);
    if (restRef.current) restRef.current.start();
  }

  return (
    <div style={{ background: "var(--surface)", border: "1px solid var(--line)", borderRadius: 10, overflow: "hidden" }}>
      <div onClick={() => onToggleOpen(idx)} style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 14px", cursor: "pointer" }}>
        <div onClick={(e) => e.stopPropagation()} style={{ display: "flex", flexDirection: "column", gap: 2 }}>
          <button onClick={() => onMoveUp(idx)} disabled={!canMoveUp} style={{ ...iconBtnStyle, padding: 2, opacity: canMoveUp ? 1 : 0.25 }}><Icon name="arrowUp" size={13} color="var(--muted)" /></button>
          <button onClick={() => onMoveDown(idx)} disabled={!canMoveDown} style={{ ...iconBtnStyle, padding: 2, opacity: canMoveDown ? 1 : 0.25 }}><Icon name="arrowDown" size={13} color="var(--muted)" /></button>
        </div>
        {confirmIdx === idx ? (
          <div onClick={(e) => e.stopPropagation()} style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <span style={{ fontSize: 11, color: "var(--muted)" }}>Eliminare?</span>
            <button onClick={() => onConfirmRemove(idx, ex.name)} style={{ ...iconBtnStyle, background: "var(--red)", borderRadius: 5, padding: 4 }}><Icon name="check" size={13} color="#fff" /></button>
            <button onClick={onCancelRemove} style={{ ...iconBtnStyle, border: "1px solid var(--line)", borderRadius: 5, padding: 4 }}><Icon name="x" size={13} color="var(--muted)" /></button>
          </div>
        ) : (
          <button onClick={(e) => { e.stopPropagation(); onRequestRemove(idx); }} style={iconBtnStyle}><Icon name="trash2" size={14} color="var(--muted)" /></button>
        )}
        <div style={{ fontSize: 14, fontWeight: 600, color: "var(--text)", flex: 1, minWidth: 0 }}>
          {ex.name}
          {ex.sets.length > 0 && <span style={{ marginLeft: 8, fontSize: 11, color: dayColor, fontWeight: 700 }}>{ex.sets.length} serie</span>}
        </div>
        <Icon name={ex.open ? "chevronUp" : "chevronDown"} size={16} color="var(--muted)" />
      </div>
      {ex.open && (
        <div style={{ padding: "0 14px 14px" }}>
          {ex.sets.map((s, sIdx) => (
            <div key={sIdx} style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 8 }}>
              <span style={{ fontSize: 12, color: "var(--muted)", width: 18 }}>{sIdx + 1}</span>
              <input type="number" placeholder="kg" value={s.weight} onChange={(e) => onUpdateSet(idx, sIdx, "weight", e.target.value)} style={inputStyle} />
              <span style={{ color: "var(--muted)", fontSize: 12 }}>x</span>
              <input type="number" placeholder="rip" value={s.reps} onChange={(e) => onUpdateSet(idx, sIdx, "reps", e.target.value)} style={inputStyle} />
              <button onClick={() => onRemoveSet(idx, sIdx)} style={iconBtnStyle}><Icon name="trash2" size={14} color="var(--muted)" /></button>
            </div>
          ))}
          <div style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 4, marginBottom: 8 }}>
            <span style={{ fontSize: 12, color: "var(--muted)", width: 18 }}>{ex.sets.length + 1}</span>
            <input type="number" placeholder="kg" value={draftWeight} onChange={(e) => setDraftWeight(e.target.value)} style={inputStyle} />
            <span style={{ color: "var(--muted)", fontSize: 12 }}>x</span>
            <input type="number" placeholder="rip" value={draftReps} onChange={(e) => setDraftReps(e.target.value)} style={inputStyle} />
          </div>
          <button onClick={handleDone} style={{ width: "100%", padding: "12px", borderRadius: 8, border: "none", background: dayColor, color: "#fff", fontWeight: 700, fontSize: 14, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
            <Icon name="checkCircle2" size={17} /> Serie fatta — via al recupero
          </button>
          <RestTimer ref={restRef} accentColor={dayColor} />
        </div>
      )}
    </div>
  );
}

// ---------------------------------------------------------------------------
// Log workout screen
// ---------------------------------------------------------------------------
function LogScreen({ onSave, customExercises, onAddCustomExercise, removedExercises, onRemoveExercise, exerciseOrder, onReorderExercises, dayOrder, onReorder, suggestedDay }) {
  const [dayKey, setDayKey] = useState(suggestedDay || "G1");
  const [date, setDate] = useState(isoDate(new Date()));
  const [entries, setEntries] = useState(() => initEntries(suggestedDay || "G1", customExercises[suggestedDay || "G1"] || [], removedExercises[suggestedDay || "G1"] || [], exerciseOrder[suggestedDay || "G1"] || []));
  const [newExName, setNewExName] = useState("");
  const [saved, setSaved] = useState(false);
  const [showReorder, setShowReorder] = useState(false);
  const [confirmIdx, setConfirmIdx] = useState(null);
  const [sessionElapsed, setSessionElapsed] = useState(0);
  const [sessionRunning, setSessionRunning] = useState(false);
  const [sessionStarted, setSessionStarted] = useState(false);

  useEffect(() => {
    if (!sessionRunning) return;
    const id = setInterval(() => setSessionElapsed((e) => e + 1), 1000);
    return () => clearInterval(id);
  }, [sessionRunning]);

  function resolveOrder(day, extra, removed, order) {
    const combined = [...PROGRAM[day].exercises, ...extra].filter((name) => !removed.includes(name));
    const stored = (order || []).filter((n) => combined.includes(n));
    const missing = combined.filter((n) => !stored.includes(n));
    return [...stored, ...missing];
  }
  function initEntries(day, extra, removed, order) {
    return resolveOrder(day, extra, removed, order).map((name) => ({ name, sets: [], open: false }));
  }
  function switchDay(day) {
    setDayKey(day); setConfirmIdx(null);
    setEntries(initEntries(day, customExercises[day] || [], removedExercises[day] || [], exerciseOrder[day] || []));
  }
  function requestRemove(idx) { setConfirmIdx(idx); }
  function cancelRemove() { setConfirmIdx(null); }
  function confirmRemove(idx, name) {
    setEntries((prev) => prev.filter((_, i) => i !== idx));
    onRemoveExercise(dayKey, name);
    setConfirmIdx(null);
  }
  function moveExercise(idx, direction) {
    const toIdx = idx + direction;
    if (toIdx < 0 || toIdx >= entries.length) return;
    const next = [...entries];
    [next[idx], next[toIdx]] = [next[toIdx], next[idx]];
    setEntries(next);
    onReorderExercises(dayKey, next.map((e) => e.name));
  }
  function moveDay(fromIdx, direction) {
    const toIdx = fromIdx + direction;
    if (toIdx < 0 || toIdx >= dayOrder.length) return;
    const next = [...dayOrder];
    [next[fromIdx], next[toIdx]] = [next[toIdx], next[fromIdx]];
    onReorder(next);
  }
  function toggleOpen(idx) { setEntries((prev) => prev.map((e, i) => (i === idx ? { ...e, open: !e.open } : e))); }
  function addCompletedSet(idx, weight, reps) { setEntries((prev) => prev.map((e, i) => (i === idx ? { ...e, open: true, sets: [...e.sets, { weight, reps }] } : e))); }
  function updateSet(idx, sIdx, field, value) {
    setEntries((prev) => prev.map((e, i) => { if (i !== idx) return e; const sets = e.sets.map((s, si) => (si === sIdx ? { ...s, [field]: value } : s)); return { ...e, sets }; }));
  }
  function removeSet(idx, sIdx) { setEntries((prev) => prev.map((e, i) => (i !== idx ? e : { ...e, sets: e.sets.filter((_, si) => si !== sIdx) }))); }
  function addExerciseToDay() {
    const name = newExName.trim(); if (!name) return;
    onAddCustomExercise(dayKey, name);
    setEntries((prev) => [...prev, { name, sets: [], open: true }]);
    setNewExName("");
  }
  function handleSave() {
    const filled = entries.filter((e) => e.sets.some((s) => s.weight !== "" && s.reps !== ""));
    if (filled.length === 0) return;
    const workout = { id: uid(), date, day: dayKey, loggedHour: new Date().getHours(), durationSec: sessionElapsed, exercises: filled.map((e) => ({ name: e.name, sets: e.sets.filter((s) => s.weight !== "" && s.reps !== "") })) };
    onSave(workout);
    setEntries(initEntries(dayKey, customExercises[dayKey] || [], removedExercises[dayKey] || [], exerciseOrder[dayKey] || []));
    setSaved(true); setSessionElapsed(0); setSessionRunning(false); setSessionStarted(false);
    setTimeout(() => setSaved(false), 1800);
  }
  function startWorkout() { setSessionStarted(true); setSessionRunning(true); }

  const dayColor = PROGRAM[dayKey].color;

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: "var(--surface)", border: "1px solid var(--line)", borderRadius: 10, padding: "10px 14px", marginBottom: 12 }}>
        <div style={{ fontSize: 12, color: "var(--muted)" }}>Prossimo consigliato: <span style={{ color: PROGRAM[suggestedDay]?.color, fontWeight: 700 }}>{PROGRAM[suggestedDay]?.label || "—"}</span></div>
        <button onClick={() => setShowReorder((v) => !v)} style={smallBtnStyle}><Icon name="repeat" size={13} /> Cambia rotazione</button>
      </div>

      {showReorder && (
        <div style={{ background: "var(--surface)", border: "1px solid var(--line)", borderRadius: 10, padding: 12, marginBottom: 14 }}>
          <div style={{ fontSize: 11, color: "var(--muted)", marginBottom: 8 }}>Sposta un giorno per cambiare l'ordine della rotazione.</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {dayOrder.map((k, i) => (
              <div key={k} style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontSize: 12, color: "var(--muted)", width: 18 }}>{i + 1}.</span>
                <span style={{ fontSize: 13, color: PROGRAM[k].color, fontWeight: 600, flex: 1 }}>{PROGRAM[k].label}</span>
                <button disabled={i === 0} onClick={() => moveDay(i, -1)} style={{ ...iconBtnStyle, opacity: i === 0 ? 0.3 : 1 }}><Icon name="arrowUp" size={15} color="var(--muted)" /></button>
                <button disabled={i === dayOrder.length - 1} onClick={() => moveDay(i, 1)} style={{ ...iconBtnStyle, opacity: i === dayOrder.length - 1 ? 0.3 : 1 }}><Icon name="arrowDown" size={15} color="var(--muted)" /></button>
              </div>
            ))}
          </div>
        </div>
      )}

      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 16 }}>
        {[...dayOrder, "LIBERO"].map((k) => (
          <button key={k} onClick={() => switchDay(k)} style={{ padding: "8px 14px", borderRadius: 8, border: `1px solid ${dayKey === k ? PROGRAM[k].color : "var(--line)"}`, background: dayKey === k ? PROGRAM[k].color : "transparent", color: dayKey === k ? "#fff" : "var(--muted)", fontSize: 13, fontWeight: 600, cursor: "pointer", whiteSpace: "nowrap" }}>
            {k === "LIBERO" ? "Libera" : k}
          </button>
        ))}
      </div>

      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 18 }}>
        <Icon name="calendar" size={16} color="var(--muted)" />
        <input type="date" value={date} onChange={(e) => setDate(e.target.value)} style={{ background: "var(--surface)", border: "1px solid var(--line)", borderRadius: 6, padding: "6px 10px", color: "var(--text)", fontSize: 13 }} />
        <div style={{ marginLeft: "auto", fontFamily: "'Bebas Neue', sans-serif", fontSize: 20, color: dayColor, letterSpacing: 0.5 }}>{PROGRAM[dayKey].label}</div>
      </div>

      <SessionTimer accentColor={dayColor} elapsed={sessionElapsed} running={sessionRunning} onToggle={() => setSessionRunning((r) => !r)} started={sessionStarted} onStart={startWorkout} />

      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {entries.map((ex, idx) => (
          <ExerciseCard key={ex.name + idx} ex={ex} idx={idx} dayColor={dayColor}
            onToggleOpen={toggleOpen} onMoveUp={(i) => moveExercise(i, -1)} onMoveDown={(i) => moveExercise(i, 1)}
            canMoveUp={idx > 0} canMoveDown={idx < entries.length - 1}
            confirmIdx={confirmIdx} onRequestRemove={requestRemove} onCancelRemove={cancelRemove} onConfirmRemove={confirmRemove}
            onAddCompletedSet={addCompletedSet} onUpdateSet={updateSet} onRemoveSet={removeSet}
          />
        ))}
        <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
          <input placeholder="Aggiungi esercizio extra..." value={newExName} onChange={(e) => setNewExName(e.target.value)} style={{ ...inputStyle, flex: 1, width: "auto" }} />
          <button onClick={addExerciseToDay} style={smallBtnStyle}><Icon name="plus" size={13} /> Aggiungi</button>
        </div>
      </div>

      <button onClick={handleSave} style={{ marginTop: 20, width: "100%", padding: "14px", borderRadius: 10, border: "none", background: saved ? "#3E7A4F" : "var(--red)", color: "#fff", fontWeight: 700, fontSize: 15, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
        {saved ? (<><Icon name="check" size={18} /> Allenamento salvato</>) : "Salva allenamento"}
      </button>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Mini SVG line chart (no external chart lib)
// ---------------------------------------------------------------------------
function MiniChart({ data, color }) {
  if (data.length < 2) return null;
  const w = 300, h = 140, pad = 26;
  const values = data.map((d) => d.est1rm);
  const min = Math.min(...values), max = Math.max(...values);
  const range = max - min || 1;
  const stepX = (w - pad * 2) / (data.length - 1);
  const pt = (d, i) => { const x = pad + i * stepX; const y = h - pad - ((d.est1rm - min) / range) * (h - pad * 2); return { x, y }; };
  const points = data.map((d, i) => { const p = pt(d, i); return `${p.x},${p.y}`; }).join(" ");
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: 140 }}>
      <text x={pad} y="14" fontSize="11" fill={color} fontWeight="700">{Math.round(max)}kg</text>
      <polyline points={points} fill="none" stroke={color} strokeWidth="2.5" />
      {data.map((d, i) => { const p = pt(d, i); return <circle key={i} cx={p.x} cy={p.y} r="3.5" fill={color} />; })}
      <text x={pad} y={h - 6} fontSize="9" fill="var(--muted)">{data[0].label}</text>
      <text x={w - pad} y={h - 6} fontSize="9" fill="var(--muted)" textAnchor="end">{data[data.length - 1].label}</text>
    </svg>
  );
}

// ---------------------------------------------------------------------------
// Records screen
// ---------------------------------------------------------------------------
function buildExerciseHistory(workouts, exerciseName) {
  const points = [];
  const sorted = [...workouts].sort((a, b) => new Date(a.date) - new Date(b.date));
  for (const w of sorted) {
    const ex = w.exercises.find((e) => e.name === exerciseName);
    if (!ex) continue;
    let best = 0;
    for (const s of ex.sets) { const e1 = estOneRM(Number(s.weight) || 0, Number(s.reps) || 0); if (e1 > best) best = e1; }
    if (best > 0) points.push({ date: w.date, label: new Date(w.date).toLocaleDateString("it-IT", { day: "numeric", month: "short" }), est1rm: Math.round(best) });
  }
  return points;
}

function RecordsScreen({ stats, workouts }) {
  const [expanded, setExpanded] = useState(null);
  const entries = Object.entries(stats.prByExercise).sort((a, b) => b[1].est1rm - a[1].est1rm);
  if (entries.length === 0) return <Empty text="Ancora nessun record. Registra un allenamento per iniziare a tracciarli." />;
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
      {entries.map(([name, pr]) => {
        const isOpen = expanded === name;
        const history = isOpen ? buildExerciseHistory(workouts, name) : [];
        return (
          <div key={name} style={{ background: "var(--surface)", border: "1px solid var(--line)", borderRadius: 10, overflow: "hidden" }}>
            <div onClick={() => setExpanded(isOpen ? null : name)} style={{ padding: "12px 14px", display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer" }}>
              <div>
                <div style={{ fontSize: 13, fontWeight: 600, color: "var(--text)" }}>{name}</div>
                <div style={{ fontSize: 11, color: "var(--muted)", marginTop: 2 }}>{new Date(pr.date).toLocaleDateString("it-IT", { day: "numeric", month: "short" })} · {pr.weight}kg x {pr.reps}</div>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <div style={{ textAlign: "right" }}>
                  <div style={{ fontSize: 10, color: "var(--muted)" }}>1RM stimato</div>
                  <div style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 22, color: "var(--red)" }}>{Math.round(pr.est1rm)}kg</div>
                </div>
                <Icon name={isOpen ? "chevronUp" : "chevronDown"} size={16} color="var(--muted)" />
              </div>
            </div>
            {isOpen && (
              <div style={{ padding: "0 14px 16px" }}>
                {history.length < 2 ? <div style={{ fontSize: 12, color: "var(--muted)" }}>Serve almeno un secondo allenamento su questo esercizio per vedere il grafico.</div> : <MiniChart data={history} color="var(--red)" />}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ---------------------------------------------------------------------------
// Main App
// ---------------------------------------------------------------------------
function App() {
  const [tab, setTab] = useState("log");
  const [workouts, setWorkouts] = useState([]);
  const [customExercises, setCustomExercises] = useState({});
  const [removedExercises, setRemovedExercises] = useState({});
  const [exerciseOrder, setExerciseOrder] = useState({});
  const [dayOrder, setDayOrder] = useState(DEFAULT_ORDER);
  const [loaded, setLoaded] = useState(false);
  const [storageError, setStorageError] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get(STORAGE_KEY);
        if (res && res.value) {
          const parsed = JSON.parse(res.value);
          setWorkouts(parsed.workouts || []);
          setCustomExercises(parsed.customExercises || {});
          setRemovedExercises(parsed.removedExercises || {});
          setExerciseOrder(parsed.exerciseOrder || {});
          setDayOrder(parsed.dayOrder || DEFAULT_ORDER);
        }
      } catch (e) { /* no existing data yet */ }
      setLoaded(true);
    })();
  }, []);

  const persistChainRef = useRef(Promise.resolve());
  const persist = useCallback((nextWorkouts, nextCustom, nextDayOrder, nextRemoved, nextExerciseOrder) => {
    const payload = JSON.stringify({ workouts: nextWorkouts, customExercises: nextCustom, dayOrder: nextDayOrder, removedExercises: nextRemoved, exerciseOrder: nextExerciseOrder });
    persistChainRef.current = persistChainRef.current.then(async () => {
      let ok = false;
      for (let attempt = 0; attempt < 3 && !ok; attempt++) {
        if (attempt > 0) await new Promise((r) => setTimeout(r, 350 * attempt));
        try { const result = await storage.set(STORAGE_KEY, payload); if (result) ok = true; } catch (e) { ok = false; }
      }
      setStorageError(!ok);
    });
  }, []);

  function handleSaveWorkout(w) { setWorkouts((prev) => { const next = [...prev, w]; persist(next, customExercises, dayOrder, removedExercises, exerciseOrder); return next; }); }
  function handleDeleteWorkout(id) { setWorkouts((prev) => { const next = prev.filter((w) => w.id !== id); persist(next, customExercises, dayOrder, removedExercises, exerciseOrder); return next; }); }
  function handleAddCustomExercise(day, name) {
    setCustomExercises((prev) => { const list = prev[day] || []; if (list.includes(name)) return prev; const next = { ...prev, [day]: [...list, name] }; persist(workouts, next, dayOrder, removedExercises, exerciseOrder); return next; });
  }
  function handleRemoveExercise(day, name) {
    setCustomExercises((prevCustom) => {
      const list = prevCustom[day] || [];
      if (list.includes(name)) { const nextCustom = { ...prevCustom, [day]: list.filter((n) => n !== name) }; persist(workouts, nextCustom, dayOrder, removedExercises, exerciseOrder); return nextCustom; }
      setRemovedExercises((prevRemoved) => {
        const rlist = prevRemoved[day] || [];
        if (rlist.includes(name)) return prevRemoved;
        const nextRemoved = { ...prevRemoved, [day]: [...rlist, name] };
        persist(workouts, prevCustom, dayOrder, nextRemoved, exerciseOrder);
        return nextRemoved;
      });
      return prevCustom;
    });
  }
  function handleReorderExercises(day, orderedNames) {
    setExerciseOrder((prev) => { const next = { ...prev, [day]: orderedNames }; persist(workouts, customExercises, dayOrder, removedExercises, next); return next; });
  }
  function handleReorder(nextOrder) { setDayOrder(nextOrder); persist(workouts, customExercises, nextOrder, removedExercises, exerciseOrder); }

  const stats = useMemo(() => computeStats(workouts), [workouts]);
  const achievements = useMemo(() => buildAchievements(stats), [stats]);
  const unlockedCount = achievements.filter((a) => a.unlocked).length;
  const suggestedDay = useMemo(() => computeNextSuggested(workouts, dayOrder), [workouts, dayOrder]);

  if (!loaded) {
    return <div style={{ background: "var(--bg)", color: "var(--text)", display: "flex", alignItems: "center", justifyContent: "center", minHeight: "100vh" }}><div style={{ color: "var(--muted)", fontSize: 13 }}>Caricamento...</div></div>;
  }

  return (
    <div style={{ background: "var(--bg)", color: "var(--text)", padding: "20px 16px 40px", minHeight: "100vh" }}>
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 18 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <Icon name="dumbbell" size={22} color="var(--red)" />
          <span style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 30, letterSpacing: 1, color: "var(--text)" }}>GHISA</span>
        </div>
        <div style={{ fontSize: 11, color: "var(--muted)" }}>{workouts.length} allenamenti totali</div>
      </div>

      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 20 }}>
        <Stat iconName="flame" label="Streak settimanale" value={`${stats.weeklyStreak}`} accent="var(--red)" />
        <Stat iconName="trendingUp" label="Volume totale" value={`${Math.round(stats.totalVolume / 1000)}t`} accent="var(--gold)" />
        <Stat iconName="award" label="Traguardi" value={`${unlockedCount}/${achievements.length}`} accent="var(--gold)" />
      </div>

      {storageError && (
        <div style={{ background: "#3A1E1E", border: "1px solid var(--red)", borderRadius: 8, padding: "10px 14px", fontSize: 12, color: "var(--text)", marginBottom: 16 }}>
          Salvataggio non riuscito — i dati di questa sessione potrebbero non persistere.
        </div>
      )}

      <div style={{ display: "flex", gap: 6, marginBottom: 20, borderBottom: "1px solid var(--line)" }}>
        {[{ key: "log", label: "Allenamento", icon: "dumbbell" }, { key: "history", label: "Storico", icon: "calendar" }, { key: "records", label: "Record", icon: "trendingUp" }, { key: "achievements", label: "Traguardi", icon: "trophy" }].map((t) => (
          <button key={t.key} onClick={() => setTab(t.key)} style={{ background: "none", border: "none", cursor: "pointer", padding: "10px 4px", marginRight: 14, color: tab === t.key ? "var(--text)" : "var(--muted)", borderBottom: tab === t.key ? "2px solid var(--red)" : "2px solid transparent", fontSize: 13, fontWeight: 600, display: "flex", alignItems: "center", gap: 6 }}>
            <Icon name={t.icon} size={14} />{t.label}
          </button>
        ))}
      </div>

      {tab === "log" && <LogScreen onSave={handleSaveWorkout} customExercises={customExercises} onAddCustomExercise={handleAddCustomExercise} removedExercises={removedExercises} onRemoveExercise={handleRemoveExercise} exerciseOrder={exerciseOrder} onReorderExercises={handleReorderExercises} dayOrder={dayOrder} onReorder={handleReorder} suggestedDay={suggestedDay} />}
      {tab === "history" && <HistoryScreen workouts={workouts} onDelete={handleDeleteWorkout} />}
      {tab === "records" && <RecordsScreen stats={stats} workouts={workouts} />}
      {tab === "achievements" && (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(240px, 1fr))", gap: 10 }}>
          {achievements.map((a) => <Badge key={a.id} ach={a} />)}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
