<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>GHISA — Log Allenamenti</title>
<meta name="theme-color" content="#101012" />
<meta name="description" content="Tracker allenamenti personale — carichi, storico, record, traguardi." />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="GHISA" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" />
<style>
  :root {
    --bg: #101012;
    --surface: #18181B;
    --line: #2A2A2F;
    --text: #F2F0EC;
    --muted: #8B8B93;
    --red: #B23A2E;
    --gold: #D4A72C;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body { font-family: 'Inter', sans-serif; color: var(--text); -webkit-tap-highlight-color: transparent; }
  input[type=number]::-webkit-inner-spin-button { opacity: 0.4; }
  input:focus { outline: 1px solid var(--red); }
  button { font-family: inherit; }
  #root { max-width: 640px; margin: 0 auto; min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>
<div id="fallback" style="display:none; padding:24px 20px; font-family:sans-serif; color:#F2F0EC; background:#101012; min-height:100vh; box-sizing:border-box;">
  <h2 style="margin-top:0;">GHISA non si è caricata</h2>
  <p id="fallback-msg" style="color:#8B8B93; line-height:1.5;"></p>
  <p style="color:#8B8B93; font-size:13px;">Prova a ricaricare la pagina, oppure prova con un'altra connessione (WiFi/dati mobili) — a volte un firewall o un blocco annunci impedisce il caricamento di alcune risorse esterne.</p>
</div>

<script>
  setTimeout(function () {
    var root = document.getElementById("root");
    if (!root || root.children.length === 0) {
      document.getElementById("fallback").style.display = "block";
      var msg = [];
      if (typeof React === "undefined") msg.push("React non si è caricato.");
      if (typeof ReactDOM === "undefined") msg.push("ReactDOM non si è caricato.");
      if (typeof Babel === "undefined") msg.push("Babel non si è caricato.");
      if (msg.length === 0) msg.push("Le librerie si sono caricate correttamente, ma l'app non è riuscita ad avviarsi.");
      document.getElementById("fallback-msg").textContent = msg.join(" ");
    }
  }, 6000);
</script>

<!-- Librerie stabili caricate da UNPKG senza conflitti di moduli esterni -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useMemo, useCallback, useRef, forwardRef, useImperativeHandle } = React;

const storage = {
  get: async (key) => {
    const raw = window.localStorage.getItem(key);
    if (raw === null) throw new Error("not found");
    return { key, value: raw, shared: false };
  },
  set: async (key, value) => {
    try {
      window.localStorage.setItem(key, value);
      return { key, value, shared: false };
    } catch (e) {
      return null;
    }
  },
};

function Icon({ name, size = 16, color = "currentColor", style }) {
  const c = { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round", style };
  switch (name) {
    case "dumbbell": return <svg {...c}><line x1="4" y1="12" x2="20" y2="12" /><rect x="2" y="9" width="4" height="6" rx="1" /><rect x="18" y="9" width="4" height="6" rx="1" /></svg>;
    case "flame": return <svg {...c}><path d="M12 2c1.2 4-2.6 5.2-2.6 9.2A4.6 4.6 0 0014 15.8c1.7 0 3.2-.9 4-2.3.6 1 .6 2.3 0 3.3A6.6 6.6 0 0112 20a6.6 6.6 0 01-6-9.4C7 8 9 6.8 8.6 4.4 9.8 5 11 6.4 11 8c0-2.4-.4-4.4 1-6z" /></svg>;
    case "trophy": return <svg {...c}><path d="M6 4h12v3a6 6 0 01-12 0V4z" /><path d="M9 17h6" /><path d="M12 13v4" /><path d="M6 4H4a3 3 0 003 3" /><path d="M18 4h2a3 3 0 01-3 3" /></svg>;
    case "calendar": return <svg {...c}><rect x="3" y="5" width="18" height="16" rx="2" /><line x1="3" y1="10" x2="21" y2="10" /><line x1="8" y1="3" x2="8" y2="7" /><line x1="16" y1="3" x2="16" y2="7" /></svg>;
    case "plus": return <svg {...c}><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></svg>;
    case "trash2": return <svg {...c}><polyline points="3 6 5 6 21 6" /><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6" /><path d="M10 11v6" /><path d="M14 11v6" /><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2" /></svg>;
    case "chevronDown": return <svg {...c}><polyline points="6 9 12 15 18 9" /></svg>;
    case "chevronUp": return <svg {...c}><polyline points="18 15 12 9 6 15" /></svg>;
    case "trendingUp": return <svg {...c}><polyline points="3 17 9 11 13 15 21 6" /><polyline points="14 6 21 6 21 13" /></svg>;
    case "award": return <svg {...c}><circle cx="12" cy="8" r="6" /><path d="M9 14l-2 7 5-3 5 3-2-7" /></svg>;
    case "lock": return <svg {...c}><rect x="5" y="11" width="14" height="9" rx="2" /><path d="M8 11V7a4 4 0 018 0v4" /></svg>;
    case "check": return <svg {...c}><polyline points="20 6 9 17 4 12" /></svg>;
    case "x": return <svg {...c}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>;
    case "arrowUp": return <svg {...c}><line x1="12" y1="19" x2="12" y2="5" /><polyline points="5 12 12 5 19 12" /></svg>;
    case "arrowDown": return <svg {...c}><line x1="12" y1="5" x2="12" y2="19" /><polyline points="19 12 12 19 5 12" /></svg>;
    case "repeat": return <svg {...c}><polyline points="17 1 21 5 17 9" /><path d="M3 11V9a4 4 0 014-4h14" /><polyline points="7 23 3 19 7 15" /><path d="M21 13v2a4 4 0 01-4 4H3" /></svg>;
    case "timer": return <svg {...c}><circle cx="12" cy="13" r="8" /><line x1="12" y1="9" x2="12" y2="13" /><line x1="12" h1="13" x2="15" y2="15" /><line x1="9" y1="2" x2="15" y2="2" /></svg>;
    case "pause": return <svg {...c}><rect x="6" y="4" width="4" height="16" /><rect x="14" y="4" width="4" height="16" /></svg>;
    case "rotateCcw": return <svg {...c}><polyline points="1 4 1 10 7 10" /><path d="M3.51 15a9 9 0 102.13-9.36L1 10" /></svg>;
    case "play": return <svg {...c}><polygon points="5 3 19 12 5 21 5 3" /></svg>;
    case "checkCircle2": return <svg {...c}><path d="M22 11.08V12a10 10 0 11-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" /></svg>;
    default: return null;
  }
}

// Interfaccia e inizializzazione base dell'applicazione
function App() {
  return (
    <div style={{padding: '20px', textAlign: 'center', marginTop: '20vh'}}>
      <Icon name="dumbbell" size={48} color="var(--red)" />
      <h1 style={{fontFamily: "'Bebas Neue', sans-serif", fontSize: '3rem', letterSpacing: '1px', margin: '10px 0 0 0'}}>GHISA</h1>
      <p style={{color: 'var(--muted)', fontSize: '14px'}}>Log e schede di allenamento attive.</p>
      <div style={{marginTop: '30px', padding: '15px', background: 'var(--surface)', borderRadius: '8px', border: '1px solid var(--line)', textAlign: 'left'}}>
        <p style={{margin: '0 0 8px 0', fontWeight: '600'}}>Diego's Split Caricata</p>
        <span style={{fontSize: '13px', color: 'var(--muted)'}}>Pronta per il monitoraggio locale. Seleziona una sessione per iniziare a registrare i tuoi carichi.</span>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
