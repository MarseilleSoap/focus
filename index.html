<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHISA — Log Allenamenti</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#101012">
    <!-- Tailwind CSS per la grafica -->
    <script src="https://jsdelivr.net"></script>
    <!-- Icone Lucide -->
    <script src="https://unpkg.com"></script>
    <style>
        body {
            background-color: #101012;
            color: #f2f0ec;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>

    <!-- Punto di aggancio per React -->
    <div id="root"></div>

    <!-- Schermata di ripiego se JS non parte -->
    <div id="fallback" style="display: block; padding: 24px 20px; font-family: sans-serif; color: rgb(242, 240, 236); background: rgb(16, 16, 18); min-height: 100vh; box-sizing: border-box;">
        <h1 style="font-size: 24px; font-weight: bold; margin-bottom: 8px;">GHISA — Log Allenamenti</h1>
        <p style="color: #a1a1aa; font-size: 14px;">Caricamento dell'applicazione in corso...</p>
    </div>

    <!-- Caricamento delle librerie React e Babel da CDN esterno -->
    <script crossorigin src="https://jsdelivr.net" onerror="this.onerror=null;this.src='https://unpkg.com/react@18/umd/react.production.min.js';"></script>
    <script crossorigin src="https://jsdelivr.net" onerror="this.onerror=null;this.src='https://unpkg.com';"></script>
    <script crossorigin src="https://jsdelivr.net" onerror="this.onerror=null;this.src='https://unpkg.com';"></script>

    <!-- Codice dell'applicazione corretto per Babel in-browser -->
    <script type="text/babel" data-type="module">
        // Estrazione sicura delle funzioni di React per evitare errori di importazione esterni
        const { useState, useEffect, useRef } = React;

        function App() {
            // Rimuove la schermata nera di fallback non appena l'app React è pronta per l'inizializzazione
            useEffect(() => {
                const fallbackElement = document.getElementById('fallback');
                if (fallbackElement) {
                    fallbackElement.style.display = 'none';
                }
            }, []);

            return (
                <div class="min-h-screen p-6 flex flex-col justify-between">
                    <header class="mb-6">
                        <div class="flex items-center gap-2 mb-1">
                            <i data-lucide="dumbbell" class="w-6 h-6 text-orange-500"></i>
                            <h1 class="text-2xl font-bold tracking-tight">GHISA</h1>
                        </div>
                        <p class="text-sm text-zinc-400">Log Allenamenti e Monitoraggio Carichi</p>
                    </header>

                    <main class="flex-1 flex flex-col items-center justify-center border border-dashed border-zinc-800 rounded-xl p-8 bg-zinc-900/30">
                        <i data-lucide="plus-circle" class="w-12 h-12 text-zinc-600 mb-3"></i>
                        <p class="text-sm text-zinc-400 text-center mb-4">Nessun allenamento salvato nel registro.</p>
                        <button class="bg-orange-500 hover:bg-orange-600 text-white font-medium text-sm px-4 py-2 rounded-lg transition-colors">
                            Nuova Sessione
                        </button>
                    </main>

                    <footer class="mt-8 text-center text-xs text-zinc-600">
                        Dati salvati in locale nel browser del dispositivo.
                    </footer>
                </div>
            );
        }

        // Inizializzazione delle icone Lucide all'avvio dei componenti grafici
        setTimeout(() => {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        }, 100);

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <!-- Registrazione del Service Worker per il funzionamento offline dell'app -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
