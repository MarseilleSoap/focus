<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>GHISA — Log Allenamenti</title>
<meta name="theme-color" content="#101012" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="https://googleapis.com" />
<style>
  :root { --bg: #101012; --surface: #18181B; --line: #2A2A2F; --text: #F2F0EC; --muted: #8B8B93; --red: #B23A2E; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body { font-family: 'Inter', sans-serif; color: var(--text); -webkit-tap-highlight-color: transparent; }
  input[type=number]::-webkit-inner-spin-button { opacity: 0.4; }
  input:focus { outline: 1px solid var(--red); }
  button { font-family: inherit; }
  #root { max-width: 640px; margin: 0 auto; min-height: 100vh; }
  .btn { background: var(--surface); color: var(--text); border: 1px solid var(--line); padding: 10px 14px; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-weight: 500; font-size: 14px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
  .flex-between { display: flex; justify-content: space-between; align-items: center; }
  .set-row { display: grid; grid-template-columns: 40px 1fr 1fr 50px; gap: 8px; align-items: center; margin-bottom: 6px; }
  .input-field { background: #101012; border: 1px solid var(--line); color: var(--text); padding: 8px; border-radius: 4px; width: 100%; text-align: center; }
</style>
</head>
<body>
<div id="root"></div>

<!-- Caricamento delle librerie da server esterni affidabili -->
<script crossorigin src="https://unpkg.com"></script>
<script crossorigin src="https://unpkg.com"></script>
<script crossorigin src="https://unpkg.com"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const storage = {
  get: async (key) => {
    const raw = window.localStorage.getItem(key);
    if (raw === null) throw new Error("not found");
    return { key, value: raw };
  },
  set: async (key, value) => {
    try { window.localStorage.setItem(key, value); return { key, value }; } catch (e) { return null; }
  },
};

function Icon({ name, size = 16, color = "currentColor" }) {
  const c = { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" };
  switch (name) {
    case "dumbbell": return <svg {...c}><line x1="4" y1="12" x2="20" y2="12" /><rect x="2" y="9" width="4" height="6" rx="1" /><rect x="18" y="9" width="4" height="6" rx="1" /></svg>;
    case "chevronDown": return <svg {...c}><polyline points="6 9 12 15 18 9" /></svg>;
    case "check": return <svg {...c}><polyline points="20 6 9 17 4 12" /></svg>;
    case "x": return <svg {...c}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>;
    default: return null;
  }
}

const PROGRAMMA_DIEGO = [
  { giorno: "Giorno 1 — Petto & Bicipiti", esercizi: [{ nome: "Panca Piana Bilanciere", target: "4 x 6-8 rep" }, { nome: "Spinte Manubri Inclinata", target: "3 x 10 rep" }, { nome: "Croci ai Cavi", target: "3 x 12 rep" }, { nome: "Curl Bilanciere EZ", target: "4 x 8 rep" }, { nome: "Curl Manubri Alternato", target: "3 x 12 rep" }] },
  { giorno: "Giorno 2 — Gambe & Addome", esercizi: [{ nome: "Squat Bilanciere", target: "4 x 6 rep" }, { nome: "Leg Press", target: "3 x 10 rep" }, { nome: "Leg Extension", target: "3 x 12 rep" }, { nome: "Leg Curl", target: "4 x 10 rep" }, { nome: "Crunch Addominali", target: "4 x 15 rep" }] },
  { giorno: "Giorno 3 — Dorso & Tricipiti", esercizi: [{ nome: "Trazioni alla Sbarra", target: "4 x max rep" }, { nome: "Rematore Bilanciere", target: "3 x 8 rep" }, { nome: "Lat Machine Avanti", target: "3 x 10 rep" }, { nome: "Pushdown Tricipiti Cavo", target: "4 x 10 rep" }, { nome: "French Press Manubri", target: "3 x 12 rep" }] },
  { giorno: "Giorno 4 — Spalle & Polpacci", esercizi: [{ nome: "Military Press", target: "4 x 6 rep" }, { nome: "Alzate Laterali Manubri", target: "4 x 12 rep" }, { nome: "Alzate Posteriori Cavi", target: "3 x 12 rep" }, { nome: "Calf Raise in Piedi", target: "4 x 15 rep" }] }
];

function App() {
  const [schedaSelezionata, setSchedaSelezionata] = useState(null);
  const [storicoCarichi, setStoricoCarichi] = useState({});

  useEffect(() => {
    storage.get("ghisa_carichi").then((res) => {
      if (res && res.value) setStoricoCarichi(JSON.parse(res.value));
    }).catch(() => {});
  }, []);

  const salvaDatoSet = (esNome, setIndex, campo, valore) => {
    const nuoviCarichi = { ...storicoCarichi };
    if (!nuoviCarichi[esNome]) nuoviCarichi[esNome] = [{}, {}, {}, {}];
    if (!nuoviCarichi[esNome][setIndex]) nuoviCarichi[esNome][setIndex] = {};
    nuoviCarichi[esNome][setIndex][campo] = valore;
    setStoricoCarichi(nuoviCarichi);
    storage.set("ghisa_carichi", JSON.stringify(nuoviCarichi));
  };

  return (
    <div style={{padding: '16px 16px 40px 16px'}}>
      <header style={{display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '24px', borderBottom: '1px solid var(--line)', paddingBottom: '14px'}}>
        <div style={{display: 'flex', alignItems: 'center', gap: '10px'}}>
          <Icon name="dumbbell" size={28} color="var(--red)" />
          <h1 style={{fontFamily: "'Bebas Neue', sans-serif", fontSize: '2.2rem', margin: 0, letterSpacing: '0.5px'}}>GHISA</h1>
        </div>
        <span style={{fontSize: '12px', background: 'var(--surface)', padding: '4px 8px', borderRadius: '4px', color: 'var(--muted)', border: '1px solid var(--line)'}}>v1.2.0</span>
      </header>

      {schedaSelezionata === null ? (
        <div>
          <h3 style={{margin: '0 0 14px 0', fontSize: '14px', color: 'var(--muted)', fontWeight: '600', letterSpacing: '0.5px'}}>SELEZIONA ALLENAMENTO</h3>
          {PROGRAMMA_DIEGO.map((prog, idx) => (
            <div key={idx} className="card flex-between" style={{cursor: 'pointer'}} onClick={() => setSchedaSelezionata(idx)}>
              <div>
                <h4 style={{margin: '0 0 4px 0', fontSize: '16px', fontWeight: '600'}}>{prog.giorno}</h4>
                <p style={{margin: 0, fontSize: '13px', color: 'var(--muted)'}}>{prog.esercizi.length} esercizi</p>
              </div>
              <Icon name="chevronDown" size={18} color="var(--muted)" />
            </div>
          ))}
        </div>
      ) : (
        <div>
          <button className="btn" style={{marginBottom: '16px'}} onClick={() => setSchedaSelezionata(null)}>
            <Icon name="x" size={14} /> Chiudi scheda
          </button>
          <h2 style={{margin: '0 0 16px 0', fontSize: '18px', fontWeight: '700', color: 'var(--red)'}}>{PROGRAMMA_DIEGO[schedaSelezionata].giorno}</h2>
          
          <div>
            {PROGRAMMA_DIEGO[schedaSelezionata].esercizi.map((es, esIdx) => (
              <div key={esIdx} className="card">
                <div style={{marginBottom: '12px'}}>
                  <h4 style={{margin: '0 0 2px 0', fontSize: '15px', fontWeight: '600'}}>{es.nome}</h4>
                  <p style={{margin: 0, fontSize: '12px', color: 'var(--muted)'}}>{es.target}</p>
                </div>
                <div style={{display: 'grid', gridTemplateColumns: '40px 1fr 1fr 50px', gap: '8px', marginBottom: '4px', fontSize: '11px', color: 'var(--muted)', textAlign: 'center'}}>
                  <div>SET</div><div>KG</div><div>REP</div><div>DONE</div>
                </div>
                {[0, 1, 2, 3].map((setIdx) => {
                  const datiSet = (storicoCarichi[es.nome] && storicoCarichi[es.nome][setIdx]) || {};
                  return (
                    <div key={setIdx} className="set-row">
                      <div style={{textAlign: 'center', fontSize: '13px', color: 'var(--muted)', fontWeight: 'bold'}}>{setIdx + 1}</div>
                      <input type="number" step="0.5" placeholder="--" className="input-field" value={datiSet.kg || ""} onChange={(e) => salvaDatoSet(es.nome, setIdx, 'kg', e.target.value)} />
                      <input type="number" placeholder="--" className="input-field" value={datiSet.rep || ""} onChange={(e) => salvaDatoSet(es.nome, setIdx, 'rep', e.target.value)} />
                      <button onClick={() => salvaDatoSet(es.nome, setIdx, 'fatto', !datiSet.fatto)} className="btn" style={{padding: '6px', width: '100%', justifyContent: 'center', background: datiSet.fatto ? 'var(--red)' : '#101012', borderColor: datiSet.fatto ? 'var(--red)' : 'var(--line)'}}>
                        <Icon name="check" size={14} color={datiSet.fatto ? '#fff' : 'var(--muted)'} />
                      </button>
                    </div>
                  );
                })}
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
